<svg xmlns="http://www.w3.org/2000/svg"
     width="70"
     height="20"
     viewBox="0 0 70 20"
     role="img"
     aria-label="Email">

  <!-- Background -->
  <rect width="70" height="20" rx="2" fill="#0078D4"/>

  <!-- Email envelope -->
  <rect x="5" y="5" width="13" height="10" rx="1" fill="#FFFFFF"/>

  <!-- Envelope fold -->
  <path d="M6 6 L11.5 10.5 L17 6"
        fill="none"
        stroke="#0078D4"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Email text -->
  <text x="23"
        y="14"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        font-weight="600"
        fill="#FFFFFF">
    Email
  </text>

</svg>