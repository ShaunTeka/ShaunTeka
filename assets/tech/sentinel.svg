<svg xmlns="http://www.w3.org/2000/svg"
     width="175"
     height="28"
     viewBox="0 0 175 28"
     role="img"
     aria-label="Microsoft Sentinel">

  <!-- Background -->
  <rect width="175" height="28" rx="3" fill="#0078D4"/>

  <!-- Security / Sentinel-style shield -->
  <path d="M16 4
           L25 7
           V13
           C25 19 21 22 16 24
           C11 22 7 19 7 13
           V7
           Z"
        fill="#FFFFFF"/>

  <!-- Security signal -->
  <circle cx="16" cy="12" r="2" fill="#0078D4"/>

  <path d="M12 17
           C13 15.5 14.5 15 16 15
           C17.5 15 19 15.5 20 17"
        fill="none"
        stroke="#0078D4"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Text -->
  <text x="34"
        y="18"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        font-weight="700"
        fill="#FFFFFF">
    MICROSOFT SENTINEL
  </text>

</svg>