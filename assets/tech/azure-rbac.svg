<svg xmlns="http://www.w3.org/2000/svg"
     width="125"
     height="28"
     viewBox="0 0 125 28"
     role="img"
     aria-label="Azure RBAC">

  <!-- Background -->
  <rect width="125" height="28" rx="3" fill="#0078D4"/>

  <!-- Access / RBAC icon -->
  <circle cx="15" cy="10" r="4" fill="#FFFFFF"/>

  <!-- User body -->
  <path d="M9 21
           C9 17 11.5 15 15 15
           C18.5 15 21 17 21 21"
        fill="#FFFFFF"/>

  <!-- Access key -->
  <circle cx="22" cy="9" r="3"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.5"/>

  <line x1="24.5"
        y1="11"
        x2="28"
        y2="14"
        stroke="#FFFFFF"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <line x1="27"
        y1="13"
        x2="29"
        y2="11"
        stroke="#FFFFFF"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Text -->
  <text x="36"
        y="18"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        font-weight="700"
        fill="#FFFFFF">
    AZURE RBAC
  </text>

</svg>