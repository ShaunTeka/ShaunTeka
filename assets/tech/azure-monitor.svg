<svg xmlns="http://www.w3.org/2000/svg"
     width="145"
     height="28"
     viewBox="0 0 145 28"
     role="img"
     aria-label="Azure Monitor">

  <!-- Background -->
  <rect width="145" height="28" rx="3" fill="#0078D4"/>

  <!-- Monitor/chart container -->
  <rect x="7"
        y="6"
        width="20"
        height="16"
        rx="2"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.6"/>

  <!-- Monitoring graph -->
  <polyline
        points="10,17 13,14 16,16 20,10 24,12"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Monitoring points -->
  <circle cx="13" cy="14" r="1.2" fill="#FFFFFF"/>
  <circle cx="20" cy="10" r="1.2" fill="#FFFFFF"/>

  <!-- Text -->
  <text x="35"
        y="18"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        font-weight="700"
        fill="#FFFFFF">
    AZURE MONITOR
  </text>

</svg>