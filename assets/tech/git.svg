<svg xmlns="http://www.w3.org/2000/svg"
     width="78"
     height="28"
     viewBox="0 0 78 28"
     role="img"
     aria-label="Git">

  <!-- Background -->
  <rect width="78"
        height="28"
        rx="3"
        fill="#F05032"/>

  <!-- Git-style branching icon -->
  <circle cx="11" cy="8" r="2.3" fill="#FFFFFF"/>
  <circle cx="11" cy="20" r="2.3" fill="#FFFFFF"/>
  <circle cx="22" cy="14" r="2.3" fill="#FFFFFF"/>

  <!-- Main branch -->
  <line x1="11"
        y1="10.3"
        x2="11"
        y2="17.7"
        stroke="#FFFFFF"
        stroke-width="1.8"/>

  <!-- Secondary branch -->
  <path d="M11 11
           C11 14 14 14 16 14
           H19.7"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <!-- Text -->
  <text x="32"
        y="18"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        font-weight="700"
        fill="#FFFFFF">
    GIT
  </text>

</svg>