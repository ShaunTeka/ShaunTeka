<svg xmlns="http://www.w3.org/2000/svg"
     width="158"
     height="28"
     viewBox="0 0 158 28"
     role="img"
     aria-label="Windows Server">

  <!-- Background -->
  <rect width="158" height="28" rx="3" fill="#0078D4"/>

  <!-- Windows-style four-pane icon -->
