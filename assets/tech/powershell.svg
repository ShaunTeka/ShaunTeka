<svg xmlns="http://www.w3.org/2000/svg"
     width="125"
     height="28"
     viewBox="0 0 125 28"
     role="img"
     aria-label="PowerShell">

  <!-- Background -->
  <rect width="125"
        height="28"
        rx="3"
        fill="#012456"/>

  <!-- PowerShell terminal tile -->
  <rect x="7"
        y="5"
        width="22"
        height="18"
        rx="2"
        fill="#FFFFFF"/>

  <!-- PowerShell command symbol -->
  <path d="M11 9
           L17 14
           L11 19"
        fill="none"
        stroke="#012456"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Underscore -->
  <line x1="18"
        y1="19"
        x2="24"
        y2="19"
        stroke="#012456"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Text -->
  <text x="37"
        y="18"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        font-weight="700"
        fill="#FFFFFF">
    POWERSHELL
  </text>

</svg>