<svg xmlns="http://www.w3.org/2000/svg"
     width="115"
     height="28"
     viewBox="0 0 115 28"
     role="img"
     aria-label="Azure VMs">

  <!-- Background -->
  <rect width="115" height="28" rx="3" fill="#0078D4"/>

  <!-- Virtual Machine / Monitor icon -->
  <rect x="7"
        y="6"
        width="18"
        height="13"
        rx="1"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.8"/>

  <!-- VM screen -->
  <rect x="10"
        y="9"
        width="12"
        height="7"
        rx="0.5"
        fill="#FFFFFF"/>

  <!-- Monitor stand -->
  <line x1="16"
        y1="19"
        x2="16"
        y2="22"
        stroke="#FFFFFF"
        stroke-width="1.8"/>

  <line x1="12"
        y1="22"
        x2="20"
        y2="22"
        stroke="#FFFFFF"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <!-- Badge text -->
  <text x="33"
        y="18"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        font-weight="700"
        fill="#FFFFFF">
    AZURE VMS
  </text>

</svg>